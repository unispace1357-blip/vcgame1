<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>던전 레이드 패턴 회피</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <header class="top-area">
      <div>
        <p class="eyebrow">WEB RAID MINI GAME</p>
        <h1>던전 레이드 패턴 회피</h1>
        <p>보스의 붉은 장판을 피해 60초 동안 생존하세요!</p>
      </div>

      <div class="status-box">
        <span>남은 시간 <strong id="time">60</strong>초</span>
        <span>HP <strong id="hp">3</strong></span>
        <span>점수 <strong id="score">0</strong></span>
      </div>
    </header>

    <main id="gameArea" class="game-area">
      <div class="arena-glow"></div>
      <div id="boss" class="boss">
        <span class="boss-eye"></span>
        <strong>BOSS</strong>
        <span class="boss-eye"></span>
      </div>
      <div id="player" class="player"></div>

      <div id="message" class="message">
        <div class="start-card">
          <p class="raid-label">RAID READY</p>
          <h2>어둠의 군주 토벌전</h2>
          <p class="desc">붉은 경고 장판이 사라진 뒤 공격이 떨어집니다.<br />좌우로 움직여 패턴을 피하세요.</p>

          <div class="rule-list">
            <span>핵심 메커닉: 패턴 회피</span>
            <span>승리 조건: 60초 생존</span>
            <span>조작: ← → 방향키</span>
          </div>

          <button id="startBtn" type="button">게임 시작</button>
          <p class="sub-text">스페이스바로도 시작할 수 있습니다.</p>
        </div>
      </div>
    </main>

    <section class="guide">
      <p><strong>조작:</strong> ← → 방향키 이동</p>
      <p><strong>승리:</strong> 60초 생존</p>
      <p><strong>패배:</strong> HP 0</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
